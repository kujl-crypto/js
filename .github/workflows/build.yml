name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Unzip
        run: unzip -q ./*.zip -d proj
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build
        run: |
          D=$(dirname "$(find proj -name settings.gradle.kts | head -1)")
          cd "$D"
          gradle assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Erika-APK
          path: proj/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
